[project]
name="enterprise-service-agent"
version="1.0.0"
requires-python=">=3.11"
dependencies=[
 "langgraph>=0.6","langchain-core>=0.3","langchain-openai>=0.3",
 "fastapi>=0.116","uvicorn[standard]>=0.35","pydantic>=2.11","pydantic-settings>=2.10",
 "httpx>=0.28","tenacity>=9.1","structlog>=25.4",
 "opentelemetry-api>=1.36","opentelemetry-sdk>=1.36","cryptography>=45",
 "psycopg[binary,pool]>=3.2","redis>=6.4","langgraph-checkpoint-postgres>=2","google-api-python-client>=2.180"
]
[project.optional-dependencies]
dev=["pytest>=8.4","pytest-asyncio>=1.1","ruff>=0.12","mypy>=1.17"]
[tool.pytest.ini_options]
pythonpath=["src"]
asyncio_mode="auto"
